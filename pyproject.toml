[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemap"
version = "0.1.0"
description = "Outside-in auditor of client-side personal-data flows on websites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "playwright>=1.50",
    "pydantic>=2.7",
    # 0.135+ ships built-in Server-Sent Events (live scan progress).
    "fastapi>=0.135",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "tldextract>=5.1",
    # Pinned: upstream idle since 2023 but abi3 wheels work on Windows/3.11.
    "adblock==0.6.0",
    "pyahocorasick>=2.1",
    "dnspython>=2.6",
    "mmh3>=4",
    "base58>=2.1",
    # networkx 3.7 requires Python 3.12; keep 3.11 working.
    "networkx>=3.6,<3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["tracemap*", "testbed*"]

[tool.setuptools.package-data]
tracemap = ["crawl/*.js", "crawl/vendor/autoconsent/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: needs a Chromium browser (Playwright)",
    "network: needs internet access",
]
